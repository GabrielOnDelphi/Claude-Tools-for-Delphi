; Product profiles for the /light-bug-MadShi crash-triage pipeline.
; Also read directly by the general /light-bug skill's Step 0 (SourceRoot, ProjectFile,
; FixesLog, BugProtocol, ...) when a bug is reported verbally rather than as a crash.
;
; The light-bug-MadShi SKILL reads the [<product>] block to find the mbox(es) and to brief the agent.
; The light-bug-MadShi AGENT receives these same paths in its briefing.
;
; Mboxes  = one or more Thunderbird mbox files, separated by | . The extractor merges
;           them newest-first and removes duplicates (the same report often sits in both
;           a parent folder and a version subfolder).
; PathRebase = "<from> => <to>" applied to source paths recorded inside the .mad before
;           the agent opens files. Empty means the recorded paths are already correct.
; MemorySub = subfolder under the agent's memory dir, so each product keeps its own crash lore.

; NOTE: This is a sanitized EXAMPLE profile for the public showcase repo.
; Replace the placeholder paths/IDs below with your own before use.

[BioniX]
ExeMatch      = BionixWallpaper.exe
Mboxes        = c:\Users\trei\AppData\Roaming\Thunderbird\Profiles\xxxxxxxx.default\Mail\mail.example.com\Inbox
SourceRoot    = c:\Projects\BioniX\
ProjectFile   = c:\Projects\BioniX\SourceCode\BionixWallpaper.dpr
ProjectClaude = c:\Projects\BioniX\CLAUDE.md
BugProtocol   = c:\Projects\BioniX\ToDo Bugs\Claude.md
FixesLog      = c:\Projects\BioniX\ToDo Bugs\Fixes Log.md
BugFolderRoot = c:\Projects\BioniX\ToDo Bugs\
ReleaseDir    = c:\Projects\BioniX\Release procedure\
PathRebase    =
MemorySub     = BioniX
OutPrefix     = bionix-

[ExampleProduct]
ExeMatch      = MyProduct.exe
Mboxes        = c:\Users\trei\AppData\Roaming\Thunderbird\Profiles\xxxxxxxx.default\Mail\Local Folders\Bug reports
SourceRoot    = c:\Projects\MyProduct\src\
ProjectFile   = c:\Projects\MyProduct\src\MyProduct.dproj
ProjectClaude = c:\Projects\MyProduct\src\CLAUDE.md
BugProtocol   = c:\Projects\MyProduct\src\CLAUDE.md
FixesLog      = c:\Projects\MyProduct\src\Fixes Log.md
BugFolderRoot = c:\Projects\MyProduct\src\ToDo Bugs\
ReleaseDir    = c:\Projects\MyProduct\Release procedure\
PathRebase    =
MemorySub     = MyProduct
OutPrefix     = myproduct-
