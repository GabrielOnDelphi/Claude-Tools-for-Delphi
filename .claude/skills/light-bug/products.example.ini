; Product profiles for the /light-bug crash-triage pipeline.
;
; COPY this file to `products.ini` (same folder) and fill in your own paths.
; `products.ini` is gitignored on purpose — it holds machine-specific mailbox
; and source paths that must never be published. This .example file is the
; template; the skill reads `products.ini`, not this one.
;
; The SKILL reads the [<product>] block to find the mbox(es) and to brief the agent.
; The light-bug AGENT receives these same paths in its briefing.
;
; Mboxes     = one or more Thunderbird mbox files, separated by | . The extractor merges
;              them newest-first and removes duplicates (the same report often sits in both
;              a parent folder and a version subfolder).
; PathRebase = "<from> => <to>" applied to source paths recorded inside the .mad before
;              the agent opens files. Empty means the recorded paths are already correct.
; MemorySub  = subfolder under the agent's memory dir, so each product keeps its own crash lore.

[ExampleProduct]
ExeMatch      = MyProduct.exe
Mboxes        = %APPDATA%\Thunderbird\Profiles\<profile>.default\Mail\<account>\Inbox
SourceRoot    = C:\Path\To\Product\
ProjectFile   = C:\Path\To\Product\SourceCode\MyProduct.dproj
ProjectClaude = C:\Path\To\Product\CLAUDE.md
BugProtocol   = C:\Path\To\Product\ToDo Bugs\Claude.md
FixesLog      = C:\Path\To\Product\ToDo Bugs\Fixes Log.md
BugFolderRoot = C:\Path\To\Product\ToDo Bugs\
ReleaseDir    = C:\Path\To\Product\Release procedure\
PathRebase    =
MemorySub     = ExampleProduct
OutPrefix     = example-

; A second product that shows the multi-mbox + PathRebase features:
; - Mboxes lists a parent folder plus two version subfolders (pipe-separated).
; - PathRebase fixes source paths recorded under an old drive/folder layout.

[SecondProduct]
ExeMatch      = SecondProduct.exe
Mboxes        = %APPDATA%\Thunderbird\Profiles\<profile>.default\Mail\Local Folders\Bug reports | %APPDATA%\Thunderbird\Profiles\<profile>.default\Mail\Local Folders\Bug reports.sbd\v2.0 | %APPDATA%\Thunderbird\Profiles\<profile>.default\Mail\Local Folders\Bug reports.sbd\v1.5
SourceRoot    = C:\Path\To\SecondProduct\src\
ProjectFile   = C:\Path\To\SecondProduct\src\SecondProduct.dproj
ProjectClaude = C:\Path\To\SecondProduct\src\CLAUDE.md
BugProtocol   = C:\Path\To\SecondProduct\src\CLAUDE.md
FixesLog      = C:\Path\To\SecondProduct\src\Fixes Log.md
BugFolderRoot = C:\Path\To\SecondProduct\src\ToDo Bugs\
ReleaseDir    = C:\Path\To\SecondProduct\Release procedure\
PathRebase    = C:\OldLayout\SecondProduct\ => C:\Path\To\SecondProduct\
MemorySub     = SecondProduct
OutPrefix     = second-
